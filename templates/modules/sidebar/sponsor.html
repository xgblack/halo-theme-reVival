<div
  th:if="${theme.config.sponsor.showSponsor}"
  class="group relative mx-auto w-full rounded-2xl border border-white/50 bg-gradient-to-br from-rose-100/40 via-amber-100/30 to-blue-100/30 p-6 shadow-xl backdrop-blur-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl md:mx-0"
>
  <!-- 装饰元素 -->
  <div class="absolute inset-0 overflow-hidden rounded-2xl">
    <div class="absolute -right-4 -top-4 h-16 w-16 rounded-full bg-pink-200/30 blur-xl"></div>
    <div class="absolute -bottom-4 -left-4 h-16 w-16 rounded-full bg-amber-200/30 blur-xl"></div>
  </div>

  <!-- 卡片内容 -->
  <div class="relative">
    <!-- 标题 -->
    <div class="mb-6 flex items-center gap-3">
      <svg class="h-8 w-8 text-rose-400 drop-shadow-sm" fill="currentColor" viewBox="0 0 24 24">
        <path
          d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
        />
      </svg>
      <h3
        class="bg-gradient-to-r from-rose-400 to-orange-400 bg-clip-text text-2xl font-bold text-transparent"
        th:text="${theme.config.sponsor.sponsorTitle}"
      >
        甜蜜赞助者
      </h3>
    </div>

    <!-- 赞助者列表 -->
    <div class="mb-6 space-y-3">
      <div
        th:each="sponsor : ${theme.config.sponsor.sponsorList}"
        class="flex items-center justify-between rounded-lg border border-white/30 bg-white/20 px-4 py-2 backdrop-blur-sm"
      >
        <span class="mr-2 truncate font-medium text-stone-700">
          <span th:text="${sponsor.icon}">🍬</span>
          <!-- 当url存在且不为空时添加链接，否则只显示文本 -->
          <a
            th:if="${sponsor.url != null && sponsor.url != ''}"
            th:href="${sponsor.url}"
            target="_blank"
            class="transition-colors duration-200 hover:text-rose-500"
            th:text="${sponsor.name}"
            >赞助档位</a
          >
          <span th:unless="${sponsor.url != null && sponsor.url != ''}" th:text="${sponsor.name}">赞助档位</span>
        </span>
        <span
          class="bg-gradient-to-r from-rose-400 to-orange-300 bg-clip-text text-sm font-semibold text-transparent"
          th:text="${sponsor.amount}"
        >
          ¥5-10
        </span>
      </div>
      <!-- 如果没有配置赞助者列表，显示默认内容 -->
      <div
        th:if="${#lists.isEmpty(theme.config.sponsor.sponsorList)}"
        class="flex items-center justify-between rounded-lg border border-white/30 bg-white/20 px-4 py-2 backdrop-blur-sm"
      >
        <span class="mr-2 truncate font-medium text-stone-700">🍬 糖果小精灵</span>
        <span class="bg-gradient-to-r from-rose-400 to-orange-300 bg-clip-text text-sm font-semibold text-transparent">
          ¥5-10
        </span>
      </div>
      <div
        th:if="${#lists.isEmpty(theme.config.sponsor.sponsorList)}"
        class="flex items-center justify-between rounded-lg border border-white/30 bg-white/20 px-4 py-2 backdrop-blur-sm"
      >
        <span class="mr-2 truncate font-medium text-stone-700">🍭 匿名甜心</span>
        <span class="bg-gradient-to-r from-rose-400 to-orange-300 bg-clip-text text-sm font-semibold text-transparent">
          ¥1-5
        </span>
      </div>
    </div>

    <!-- 进度条 -->
    <div class="relative mb-6 h-3 rounded-full bg-white/30">
      <div
        class="absolute inset-0 rounded-full bg-gradient-to-r from-rose-300 to-rose-400 shadow-inner transition-all duration-500"
        th:style="'width: ' + ${theme.config.sponsor.sponsorProgress} + '%'"
      >
        <div
          class="absolute -top-5 right-0 text-sm font-bold text-rose-500"
          th:text="${theme.config.sponsor.sponsorProgress} + '%'"
        >
          66%
        </div>
      </div>
    </div>

    <!-- 行动按钮 -->
    <a
      th:href="${theme.config.sponsor.sponsorButtonLink}"
      target="_blank"
      class="block w-full transform rounded-xl bg-gradient-to-br from-rose-400 to-orange-300 py-3.5 text-center font-semibold text-white shadow-lg transition-all duration-300 hover:scale-[1.02] hover:from-rose-400 hover:to-rose-400 hover:shadow-xl active:scale-95 group-hover:[box-shadow:0_10px_20px_-5px_rgba(254,205,211,0.5)]"
      th:text="${theme.config.sponsor.sponsorButtonText}"
    >
      成为甜心赞助商
    </a>

    <!-- 底部说明 -->
    <p
      class="mt-4 text-center text-xs leading-4 text-text-base"
      th:text="${#strings.replace(theme.config.sponsor.sponsorDescription, '\\n', '<br/>')}"
      th:utext="${#strings.replace(theme.config.sponsor.sponsorDescription, '\\n', '<br/>')}"
    >
      每笔赞助都会化作甜蜜能量<br />
      助力我们创作更多美好内容✨
    </p>
  </div>
</div>
